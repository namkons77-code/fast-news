services:
  - type: web
    name: fastapi-news-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CRAWL_INTERVAL_HOURS
        value: 1
      - key: CRAWL_ON_STARTUP
        value: true
      - key: NEWS_PER_FEED_LIMIT
        value: 30
